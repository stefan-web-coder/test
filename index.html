<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp — animacja linii postępu (4 kierunki)</title>
<style>
:root{
  --canvas:#f4f4f3;--surface:#ffffff;--line:#e2e2df;--line-strong:#c9c9c4;
  --ink:#121212;--ink-2:#5c5c58;--accent:#2f4bd0;--accent-soft:#eef1fd;--r:10px;
  --t-display:clamp(30px,3.6vw,42px);--t-body:16px;--t-ui:14px;--t-cap:13px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none}
body{
  margin:0;background:#f5efe6;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--t-body);line-height:1.55;
}
::selection{background:var(--accent-soft);color:var(--ink)}

/* — parametry ruchu; panel pisze po nich — */
#stage{--dur:320ms;--ease:cubic-bezier(0.23,1,0.32,1);--sheen:1800ms}

/* ============ otoczenie: ekran onboardingu ============ */
.v{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:20px;padding:20px clamp(20px,6vw,64px)}
.main{flex:1;display:flex;align-items:center;padding:0 clamp(20px,6vw,64px) 150px}
.col{width:100%;max-width:680px;margin-inline:auto}
.col h1{font-size:var(--t-display);line-height:1.08;letter-spacing:-0.025em;font-weight:640;margin:0 0 12px;text-wrap:balance}
.lede{color:var(--ink-2);max-width:56ch;text-wrap:pretty;margin:0}
.brandmark{font-size:var(--t-ui);font-weight:600;letter-spacing:-0.01em;user-select:none}
.count{font-size:var(--t-cap);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.field-label{display:block;font-size:var(--t-cap);color:var(--ink-2);margin-block-end:6px}

.btn{appearance:none;border:0;border-radius:var(--r);background:var(--accent);color:#fff;
  font:inherit;font-size:var(--t-ui);font-weight:600;min-height:44px;padding:0 20px;cursor:pointer;
  transition:background-color 150ms ease,transform 100ms cubic-bezier(0.25,0.46,0.45,0.94)}
.btn:hover{background:#2740b4}
.btn:active{transform:scale(0.97)}
.btn[disabled]{background:#e8e8e5;color:#6f6f6a;cursor:not-allowed}
.btn[disabled]:active{transform:none}
.btn-ghost{appearance:none;border:1px solid var(--line-strong);border-radius:var(--r);background:transparent;
  color:var(--ink);font:inherit;font-size:var(--t-ui);font-weight:500;min-height:44px;padding:0 18px;cursor:pointer;
  transition:background-color 150ms ease,border-color 150ms ease,transform 100ms cubic-bezier(0.25,0.46,0.45,0.94)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn-ghost:active{transform:scale(0.97)}
:where(button,input,select,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

input[type=email],input[type=time],input[type=number]{font:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);min-height:44px;padding:0 12px;
  transition:border-color 150ms ease,box-shadow 150ms ease}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
input[type=number],input[type=time]{font-variant-numeric:tabular-nums}

.opts{display:flex;flex-direction:column;gap:8px;margin:32px 0}
.opt{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:start;font:inherit;color:var(--ink);
  cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
  transition:border-color 150ms ease,background-color 150ms ease}
.opt:hover{border-color:var(--line-strong)}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt-box{flex:none;width:20px;height:20px;margin-block-start:2px;border-radius:6px;border:1.5px solid var(--line-strong);
  background:var(--surface);display:grid;place-items:center;transition:border-color 150ms ease,background-color 150ms ease}
.opt[aria-pressed=true] .opt-box{background:var(--accent);border-color:var(--accent)}
.opt-box::after{content:"";width:10px;height:6px;margin-block-start:-2px;border-inline-start:2px solid #fff;
  border-block-end:2px solid #fff;transform:rotate(-45deg) scale(0.6);opacity:0;transition:opacity 120ms ease,transform 160ms var(--ease)}
.opt[aria-pressed=true] .opt-box::after{opacity:1;transform:rotate(-45deg) scale(1)}
.opt-name{display:block;font-weight:520;line-height:1.35;overflow-wrap:break-word}
.opt-meta{display:block;font-size:var(--t-cap);color:var(--ink-2)}
.actions{display:flex;align-items:center;gap:12px;margin-block-start:36px}
.actions .count{margin-inline-start:auto}
.rowfields{display:flex;flex-wrap:wrap;gap:20px;margin:32px 0}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin:32px 0 0}
.addrow input{flex:1;min-width:220px}
.team{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.team li{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:8px 8px 8px 12px}
.av{flex:none;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--accent-soft);
  color:var(--accent);font-size:12px;font-weight:600;text-transform:uppercase}
.team-mail{flex:1;min-width:0;font-size:var(--t-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;border-radius:8px;
  cursor:pointer;color:var(--ink-2);font-size:18px;line-height:1;transition:background-color 150ms ease,color 150ms ease}
.iconbtn:hover{background:var(--canvas);color:var(--ink)}
.empty{border:1px dashed var(--line-strong);border-radius:8px;padding:18px;margin-block-start:16px;color:var(--ink-2);
  font-size:var(--t-ui);text-wrap:pretty}
.done h1{margin-block-end:12px}

/* ============ 1 — WYPEŁNIENIE ============ */
.bar{flex:1;position:relative;height:3px;border-radius:999px;background:var(--line);overflow:hidden}
.bar-fill{position:absolute;inset:0;background:var(--accent);border-radius:999px;
  transform-origin:left center;will-change:transform;transition:transform var(--dur) var(--ease)}

/* ============ 2 — SEGMENTY ============ */
.segs{flex:1;display:flex;gap:6px}
.seg{position:relative;flex:1;height:3px;border-radius:999px;background:var(--line);overflow:hidden}
.seg i{position:absolute;inset:0;background:var(--accent);border-radius:999px;
  transform-origin:left center;will-change:transform;transition:transform var(--dur) var(--ease)}

/* ============ 3 — CIĄG ============ */
/* clip-path zamiast scaleX: skalowanie rodzica rozjechałoby poświatę w środku */
.bar-flow{position:absolute;inset:0;background:var(--accent);border-radius:999px;overflow:hidden;
  transition:clip-path var(--dur) var(--ease)}
.sheen{position:absolute;top:0;bottom:0;left:0;width:32%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.9),rgba(255,255,255,0));
  will-change:transform;animation:sheen var(--sheen) linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(400%)}}

/* ============ 4 — KROPKA ============ */
.track{flex:1;position:relative;height:12px;display:flex;align-items:center}
.hair{position:absolute;inset-inline:0;height:1px;background:var(--line-strong)}
.ticks{position:absolute;inset-inline:0;display:flex;justify-content:space-between}
.tick{width:5px;height:5px;border-radius:999px;background:var(--line-strong);
  transition:background-color var(--dur) ease}
.tick[data-passed]{background:var(--accent)}
/* runner ma szerokość toru, więc translateX w % przesuwa o długość toru */
.runner{position:absolute;inset:0;will-change:transform;transition:transform var(--dur) var(--ease)}
.dot{position:absolute;right:0;top:50%;width:11px;height:11px;margin-block-start:-5.5px;
  transform:translateX(50%);border-radius:999px;background:var(--accent);
  box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--accent-soft)}
@keyframes pop{from{transform:translateX(50%) scale(0.4);opacity:0}to{transform:translateX(50%) scale(1);opacity:1}}
.dot.pop{animation:pop var(--dur) var(--ease) both}

@media (prefers-reduced-motion:reduce){
  .bar-fill,.seg i,.bar-flow,.runner,.tick,.opt-box::after{transition:none}
  .sheen{animation:none;opacity:0}
  .dot.pop{animation:none}
  .btn:active,.btn-ghost:active{transform:none}
}

/* ============================================================
   PICKER — dosłownie z PICKER.md
   ============================================================ */
.proto-picker {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px;
  border-radius: 999px; background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.12); will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px;
  border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55);
  font: inherit; cursor: pointer; transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }

/* ============ PANEL KONTROLNY — chrome, nie design ============ */
.proto-panel{
  position:fixed;top:24px;right:24px;z-index:2147483646;width:236px;
  display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;
  background:rgba(10,10,10,0.82);
  -webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;line-height:1.3;
  color:rgba(255,255,255,0.55);-webkit-font-smoothing:antialiased;
}
.proto-panel label{display:flex;flex-direction:column;gap:6px}
.proto-panel .lab{display:flex;justify-content:space-between;gap:8px}
.proto-panel .val{color:#fff;font-variant-numeric:tabular-nums}
.proto-panel input[type=range]{width:100%;accent-color:#fff;margin:0;height:18px}
.proto-panel select{
  width:100%;appearance:none;background:rgba(255,255,255,0.1);color:#fff;border:0;border-radius:7px;
  font:inherit;padding:7px 8px;cursor:pointer;
}
.proto-panel select option{color:#111}
.proto-panel .row{display:flex;gap:8px}
.proto-panel button{
  appearance:none;border:0;border-radius:7px;background:rgba(255,255,255,0.12);color:#fff;
  font:inherit;padding:8px;cursor:pointer;transition:background-color 150ms ease-out;
}
.proto-panel button:hover{background:rgba(255,255,255,0.2)}
.proto-panel button:focus-visible,.proto-panel select:focus-visible,.proto-panel input:focus-visible{
  outline:2px solid rgba(255,255,255,0.4);outline-offset:2px;
}
.proto-panel code{
  display:block;font-size:11px;color:rgba(255,255,255,0.45);word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.proto-panel .sheen-only{display:none}
.proto-panel[data-sheen] .sheen-only{display:flex}
@media (max-width:900px){.proto-panel{display:none}}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Wypełnienie</button>
  <button class="proto-picker-item">Segmenty</button>
  <button class="proto-picker-item">Ciąg</button>
  <button class="proto-picker-item">Kropka</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<aside class="proto-panel" id="panel" aria-label="Parametry animacji">
  <label>
    <span class="lab">Czas trwania <span class="val" id="v-dur">320 ms</span></span>
    <input type="range" id="c-dur" min="60" max="1200" step="20" value="320">
  </label>
  <label>
    <span class="lab">Krzywa</span>
    <select id="c-ease">
      <optgroup label="ease-out — wejście, wypełnianie">
        <option value="cubic-bezier(0.25,0.46,0.45,0.94)">out-quad</option>
        <option value="cubic-bezier(0.215,0.61,0.355,1)">out-cubic</option>
        <option value="cubic-bezier(0.165,0.84,0.44,1)">out-quart</option>
        <option value="cubic-bezier(0.23,1,0.32,1)" selected>out-quint</option>
        <option value="cubic-bezier(0.19,1,0.22,1)">out-expo</option>
        <option value="cubic-bezier(0.075,0.82,0.165,1)">out-circ</option>
      </optgroup>
      <optgroup label="ease-in-out — ruch po ekranie">
        <option value="cubic-bezier(0.455,0.03,0.515,0.955)">in-out-quad</option>
        <option value="cubic-bezier(0.645,0.045,0.355,1)">in-out-cubic</option>
        <option value="cubic-bezier(0.77,0,0.175,1)">in-out-quart</option>
      </optgroup>
      <optgroup label="pozostałe">
        <option value="ease">ease</option>
        <option value="linear">linear</option>
      </optgroup>
    </select>
  </label>
  <label>
    <span class="lab">Prędkość podglądu</span>
    <select id="c-speed">
      <option value="1">1×</option>
      <option value="0.5">0.5×</option>
      <option value="0.25">0.25×</option>
    </select>
  </label>
  <label class="sheen-only">
    <span class="lab">Cykl poświaty <span class="val" id="v-sheen">1800 ms</span></span>
    <input type="range" id="c-sheen" min="600" max="4000" step="100" value="1800">
  </label>
  <button id="c-copy">Kopiuj wartości</button>
  <code id="c-out"></code>
</aside>

<script>
/* ============ treść — ta sama, najgorsza z możliwych ============ */
const BREADS = [
  {id:'zytni',    name:'Chleb żytni razowy 100% na zakwasie z prażonym słonecznikiem i siemieniem lnianym', meta:'12 h garowania'},
  {id:'wiejski',  name:'Chleb pszenny wiejski',  meta:'6 h'},
  {id:'bagietka', name:'Bagietka',               meta:'4 h'},
  {id:'kajzerka', name:'Bułki kajzerki',         meta:'3 h'},
  {id:'rogal',    name:'Rogal maślany',          meta:'składanie w nocy'},
  {id:'focaccia', name:'Focaccia z rozmarynem',  meta:'5 h'}
];
const DAYS = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
const LONG_MAIL = 'malgorzata.wisniewska-chrzanowska@piekarnia-na-zakwasie.example.com';

const s = { step:0, breads:new Set(['zytni']), days:new Set([0,1,2,3,4,5]), start:'04:30', loaves:180, email:LONG_MAIL, team:[] };
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const canNext = () => s.step !== 0 || s.breads.size > 0;

/* shownStep = to, co jest aktualnie narysowane; -1 znaczy „pusto", czyli animuj od zera */
let shownStep = -1;
const fillFrac = st => st < 0 ? 0 : st === 3 ? 1 : (st + 1) / 3;
const dotFrac  = st => st < 0 ? 0 : st === 3 ? 1 : st / 2;

/* ============ cztery kierunki samej linii ============ */
function lineWypelnienie(){
  return `<div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="${Math.min(s.step+1,3)}" aria-label="Postęp konfiguracji">
    <span class="bar-fill" data-from="scaleX(${fillFrac(shownStep)})" data-to="scaleX(${fillFrac(s.step)})"></span>
  </div>`;
}
function lineSegmenty(){
  const on = st => i => st < 0 ? 0 : (st === 3 || i <= st) ? 1 : 0;
  const was = on(shownStep), is = on(s.step);
  return `<div class="segs" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="${Math.min(s.step+1,3)}" aria-label="Postęp konfiguracji">
    ${[0,1,2].map(i => `<span class="seg"><i data-from="scaleX(${was(i)})" data-to="scaleX(${is(i)})"></i></span>`).join('')}
  </div>`;
}
function lineCiag(){
  const clip = f => `inset(0 ${((1 - f) * 100).toFixed(2)}% 0 0)`;
  return `<div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="${Math.min(s.step+1,3)}" aria-label="Postęp konfiguracji">
    <span class="bar-flow" data-prop="clipPath" data-from="${clip(fillFrac(shownStep))}" data-to="${clip(fillFrac(s.step))}">
      ${s.step < 3 ? '<i class="sheen"></i>' : ''}
    </span>
  </div>`;
}
function lineKropka(){
  const tx = f => `translateX(${((f - 1) * 100).toFixed(2)}%)`;
  return `<div class="track" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="${Math.min(s.step+1,3)}" aria-label="Postęp konfiguracji">
    <span class="hair" aria-hidden="true"></span>
    <span class="ticks" aria-hidden="true">${[0,1,2].map(i => `<span class="tick" ${(s.step===3||i<=s.step)?'data-passed':''}></span>`).join('')}</span>
    <span class="runner" aria-hidden="true" data-from="${tx(dotFrac(shownStep))}" data-to="${tx(dotFrac(s.step))}">
      <span class="dot${shownStep < 0 ? ' pop' : ''}"></span>
    </span>
  </div>`;
}
const LINES = [lineWypelnienie, lineSegmenty, lineCiag, lineKropka];

/* ============ otoczenie (wspólne dla wszystkich czterech) ============ */
function screen(){
  if (s.step === 3) return `
    <div class="v">
      <header class="top"><span class="brandmark">Zakwas</span>${LINES[current]()}<span class="count">Gotowe</span></header>
      <main class="main"><div class="col done">
        <h1>Piec rozgrzany.</h1>
        <p class="lede">Plan produkcji na jutro czeka w panelu.</p>
        <div class="actions"><button class="btn" data-act="restart">Zacznij od nowa</button></div>
      </div></main>
    </div>`;

  const head = [
    ['Co pieczecie każdego dnia?','Zaznacz wypieki, które wracają na blachę codziennie.'],
    ['O której zaczyna się dzień?','Alarmy zakwasu policzymy wstecz od pierwszego wsadu.'],
    ['Kto jeszcze staje przy piecu?','Zaproszeni dostaną plan produkcji na swój telefon.']
  ][s.step];

  const body = s.step === 0
    ? `<div class="opts" role="group" aria-label="Rodzaje wypieku">${BREADS.map(b => `
        <button class="opt" data-act="toggle-bread" data-id="${b.id}" aria-pressed="${s.breads.has(b.id)}">
          <span class="opt-box" aria-hidden="true"></span>
          <span><span class="opt-name">${esc(b.name)}</span><span class="opt-meta">${esc(b.meta)}</span></span>
        </button>`).join('')}</div>`
    : s.step === 1
      ? `<div class="rowfields">
          <div><label class="field-label" for="start">Pierwszy wsad do pieca</label>
            <input id="start" type="time" data-field="start" value="${s.start}"></div>
          <div><label class="field-label" for="loaves">Bochenków dziennie</label>
            <input id="loaves" type="number" data-field="loaves" value="${s.loaves}" min="1" max="9999" style="width:120px"></div>
        </div>`
      : `<div class="addrow">
          <label class="field-label" for="mail" style="width:100%">Adres e-mail</label>
          <input id="mail" type="email" data-field="email" value="${esc(s.email)}" autocomplete="off">
          <button class="btn-ghost" data-act="add-member">Zaproś</button>
        </div>
        ${s.team.length
          ? `<ul class="team">${s.team.map((m,i)=>`<li>
              <span class="av" aria-hidden="true">${esc(m[0])}</span>
              <span class="team-mail" title="${esc(m)}">${esc(m)}</span>
              <button class="iconbtn" data-act="remove-member" data-i="${i}" aria-label="Usuń ${esc(m)} z zespołu">×</button></li>`).join('')}</ul>`
          : `<p class="empty">Nikt jeszcze nie dołączył. Zaproszenia możesz wysłać też później.</p>`}`;

  return `
    <div class="v">
      <header class="top">
        <span class="brandmark">Zakwas</span>
        ${LINES[current]()}
        <span class="count">Krok ${s.step+1} z 3</span>
      </header>
      <main class="main"><div class="col">
        <h1>${esc(head[0])}</h1>
        <p class="lede">${esc(head[1])}</p>
        ${body}
        <div class="actions">
          ${s.step > 0 ? '<button class="btn-ghost" data-act="back">Wstecz</button>' : ''}
          <button class="btn" data-act="${s.step===2?'finish':'next'}" ${canNext()?'':'disabled'}>${s.step===2?'Otwórz piekarnię':'Dalej'}</button>
          ${s.step===0 ? `<span class="count">Wybrano ${s.breads.size} z ${BREADS.length}</span>` : ''}
        </div>
      </div></main>
    </div>`;
}
const variants = [screen, screen, screen, screen];

/* ============ odpalenie przejścia po każdym renderze ============ */
function afterPaint(){
  stage.querySelectorAll('[data-to]').forEach(el => {
    const prop = el.dataset.prop || 'transform';
    el.style.transition = 'none';
    el.style[prop] = el.dataset.from;
    void el.offsetWidth;                 // wymuszony reflow: bez tego przeglądarka scali oba stany
    el.style.transition = '';
    el.style[prop] = el.dataset.to;
  });
  shownStep = s.step;
  panel.toggleAttribute('data-sheen', current === 2);
}

function paint(focusSel){
  const keep = shownStep;
  stage.innerHTML = variants[current]();
  shownStep = keep;
  afterPaint();
  if (focusSel){ const el = stage.querySelector(focusSel); if (el) el.focus({preventScroll:true}); }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !stage.contains(el)) return;
  const act = el.dataset.act;
  if (act === 'toggle-bread'){
    s.breads.has(el.dataset.id) ? s.breads.delete(el.dataset.id) : s.breads.add(el.dataset.id);
    paint(`[data-act="toggle-bread"][data-id="${el.dataset.id}"]`);
  } else if (act === 'add-member'){
    const input = stage.querySelector('[data-field="email"]');
    const val = (input ? input.value : s.email).trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)) { input?.focus(); return; }
    s.team.push(val); s.email = ''; paint('[data-field="email"]');
  } else if (act === 'remove-member'){
    s.team.splice(+el.dataset.i, 1); paint('[data-field="email"]');
  } else if (act === 'next'){
    if (!canNext()) return; s.step = Math.min(s.step+1, 2); paint();
  } else if (act === 'back'){
    s.step = Math.max(s.step-1, 0); paint();
  } else if (act === 'finish'){
    s.step = 3; paint();
  } else if (act === 'restart'){
    s.step = 0; s.team = []; s.email = LONG_MAIL; s.breads = new Set(['zytni']); shownStep = -1; paint();
  }
});
document.addEventListener('input', (e) => {
  const f = e.target.dataset ? e.target.dataset.field : null;
  if (!f) return;
  s[f] = f === 'loaves' ? (parseInt(e.target.value,10) || 0) : e.target.value;
});

/* ============ PANEL — pisze po zmiennych CSS, nie po stanie ============ */
const panel = document.getElementById('panel');
const cDur = document.getElementById('c-dur'), cEase = document.getElementById('c-ease');
const cSpeed = document.getElementById('c-speed'), cSheen = document.getElementById('c-sheen');
const out = document.getElementById('c-out');

function applyControls(){
  const speed = parseFloat(cSpeed.value);
  const dur = +cDur.value;
  stage.style.setProperty('--dur', Math.round(dur / speed) + 'ms');
  stage.style.setProperty('--ease', cEase.value);
  stage.style.setProperty('--sheen', Math.round(cSheen.value / speed) + 'ms');
  document.getElementById('v-dur').textContent = dur + ' ms';
  document.getElementById('v-sheen').textContent = cSheen.value + ' ms';
  const name = cEase.options[cEase.selectedIndex].textContent;
  out.textContent = `czas: ${dur}ms · krzywa: ${name} ${cEase.value} · poświata: ${cSheen.value}ms`;
}
[cDur, cEase, cSpeed, cSheen].forEach(el => el.addEventListener('input', applyControls));
document.getElementById('c-copy').addEventListener('click', (e) => {
  const txt = out.textContent;
  const done = () => { e.target.textContent = 'Skopiowano'; setTimeout(() => e.target.textContent = 'Kopiuj wartości', 1200); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(_) {}
    ta.remove();
  }
});

/* ============ PICKER — okablowanie z PICKER.md ============ */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  shownStep = -1;                       // przemontowanie = linia startuje od pustej
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); afterPaint(); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  try {
    const url = new URL(location);
    url.searchParams.set('v', i + 1);
    history.replaceState(null, '', url);
  } catch (_) {}
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
applyControls();
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
